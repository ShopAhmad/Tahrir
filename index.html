
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>در حال آپدیت سایت</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;font-family:Tahoma,Arial;color:#effff4;
 background:radial-gradient(circle at top,#175c38,#06180e 70%);
}
.card{
 width:100%;max-width:460px;padding:35px 25px;text-align:center;
 background:#0c2819;border:1px solid #236b43;border-radius:25px;
 box-shadow:0 20px 70px #0008;animation:appear .8s ease;
}
.icon{font-size:55px;color:#48f594;animation:spin 5s linear infinite}
h1{font-size:27px;line-height:1.8}
h1 span{color:#48f594}
p{color:#a8c9b5;line-height:2;font-size:14px}
.label{display:flex;justify-content:space-between;margin:28px 0 12px}
.percent{color:#48f594;font-weight:bold}
.track{height:13px;border-radius:20px;background:#1b3d2b;overflow:hidden}
.bar{
 width:35%;height:100%;border-radius:20px;
 background:linear-gradient(90deg,#16b85e,#66ffa2);
 box-shadow:0 0 18px #48f594;position:relative;overflow:hidden;
}
.bar:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,transparent,#ffffff80,transparent);
 animation:shine 2s infinite;
}
small{display:block;margin-top:24px;color:#80a88e}
@keyframes shine{from{transform:translateX(100%)}to{transform:translateX(-150%)}}
@keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
 <div class="icon">↻</div>
 <h1>در حال <span>آپدیت</span> سایت هستیم</h1>
 <p>در حال آماده‌سازی تجربه‌ای بهتر و امکاناتی جدید هستیم.<br>لطفاً کمی صبور باشید 🌿</p>
 <div class="label">
  <span>میزان پیشرفت</span>
  <span class="percent">35%</span>
 </div>
 <div class="track">
  <div class="bar"></div>
 </div>
 <small>۳۵ درصد انجام شده · به‌زودی برمی‌گردیم</small>
</main>
</body>
</html>
